services:
  backend:
    build: 
      context: ./movierecommendationsystem-backend
      dockerfile: Dockerfile.backend
    ports:
      - "8082:8082"
    networks:
      - app-network
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/movierecommendation
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update 
      - FILE_UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads  
    depends_on:
      - database

  database:
    image: postgres:latest
    environment:
      POSTGRES_DB: movierecommendation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data      

  frontend:
    build: 
      context: ./movierecommendationsystem-frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "4200:4200"
    networks:
      - app-network  

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./recommendation-service/app:/app
      - ./recommendation-service/pre-trained_model:/app/pre-trained_model
    networks:
      - app-network
    depends_on:
      - database    

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  uploads:
